# claude-account-guard 的工具链配置
#
# 这里显式固定 ruff 的规则集，而不是依赖 ruff 的"默认规则"：
# ruff 的默认规则集在版本之间会变化（例如 0.17 默认启用了 EXE/UP 等规则），
# 不固定的话，同一个提交在不同时间跑 CI 会得到不同结果。
# 本仓库只要求 E4/E7/E9/F 这一组（也就是 ruff 长期以来的默认集合）。
[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".git", "__pycache__", ".tmp-tests-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
