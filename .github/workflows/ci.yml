name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Windows runner 默认 cp1252，脚本输出中文时需要 UTF-8
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev tools
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Self-audit smoke test (never fails the build)
        run: python scripts/audit.py --path . --report-dir .ci-report --quiet

      - name: Scan git history for leaked credentials
        run: python scripts/check_history.py --path . --fail-on high

      - name: Ensure the three scripts stay network-free
        shell: bash
        run: |
          if grep -rnE "import (requests|socket|http\.client|urllib\.request)|from (requests|urllib\.request) import" scripts/; then
            echo "::error::scripts/ must not import network libraries"
            exit 1
          fi

  action-selftest:
    name: composite action self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run the action against this repository
        id: guard
        uses: ./
        with:
          report-dir: .account-guard
          fail-on: critical
          artifact-name: claude-account-guard-report

      - name: Verify action outputs and artifacts
        shell: bash
        run: |
          echo "critical=${{ steps.guard.outputs.critical }}"
          echo "high=${{ steps.guard.outputs.high }}"
          test -f "${{ steps.guard.outputs.report-md }}"
          test -f "${{ steps.guard.outputs.report-json }}"